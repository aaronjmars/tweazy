name: Format
on:
  push:
    branches: [main]
  pull_request:
jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Standalone Biome binary, version read from package-lock.json, so the
      # check needs no npm install. Same command as `npm run format:check`.
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1
      - run: biome ci .
