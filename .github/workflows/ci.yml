name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Read the version from .nvmrc so CI and local dev stay on the same npm
      # major. npm 10 (Node 20/22) records optional peer deps in the lockfile
      # and npm 11 (Node 24+) omits them, so a mismatch makes `npm ci` fail
      # with "Missing: <pkg> from lock file" after any local `npm install`.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Network mode defaults to testnet (src/lib/config.ts); secrets are
      # optional at build time, so the production build runs without them.
      - name: Build
        run: npm run build
