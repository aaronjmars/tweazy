name: Format
on:
  push:
    branches: [main]
  pull_request:
jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Standalone Biome binary, version read from package-lock.json, so the
      # check needs no npm install. Same command as `npm run format:check`.
      - uses: biomejs/setup-biome@v2
      - run: biome ci .
