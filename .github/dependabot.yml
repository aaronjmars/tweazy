version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned to ~1.52.0 (#56): 1.53+ pulls in unresolvable @x402/* imports
      # that break the Next.js/Turbopack build. Allow patch bumps only.
      - dependency-name: "@coinbase/cdp-sdk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
